# The daily slop (2026-10-20): one scan of the day's news slop, three layers, in order of primacy.
#   1. the register — GDELT, object-first (scripts/scan-objects.js): what formed today. The data layer.
#   2. the roster   — every show and publication we read (scripts/press-sweep.py): what the commentary
#                     said about the register's objects. Writes terms from the register, so the roster
#                     is swept for what GDELT found.
#   3. the clips    — what commentary is being passed around on Reddit (scripts/slop-clips.py): roster
#                     candidates for the WIRE intake tray.
# Keyless. Runs here because the Cowork shells can't reach the publishers, YouTube or Reddit.
# The 06:55 PT Claude task ("Prism press — daily cuts") reads the result from GitHub raw and cuts.
# The separate 05:30 newsroom scan still runs; step 1 here is the same script, so the register is
# fresh for the roster whichever fires first.
name: daily slop
on:
  schedule:
    - cron: '45 12 * * *'      # 05:45 Pacific (PDT)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-slop
  cancel-in-progress: false
jobs:
  slop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yt-dlp
      - name: 1 · the register (GDELT → objects; non-fatal)
        run: node scripts/scan-objects.js || echo "register scan failed — yesterday's register stands"
        env:
          TIMESPAN: 2d
          QUOTA: '3'
      - name: 2 · the roster (every source swept against the register; non-fatal per source)
        run: python3 scripts/press-sweep.py --no-captions   # YouTube refuses caption pulls from runner IPs; transcripts come from the Mac (the cut task)
      - name: 3 · the clips (Reddit basket → shows → roster candidates; non-fatal)
        run: python3 scripts/slop-clips.py || echo "clips scan failed — the slop stands without it"
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      - name: commit the slop
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/newsroom data/press/sweeps data/press/clips data/press/roster.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "daily slop: $(date -u +%F) — register · roster · clips"
          git pull --rebase
          git push
