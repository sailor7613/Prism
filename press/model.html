<title>Prism — the model</title>
<!-- Prism's physical model (11-10, late). One scene, left to right:
       THE OBJECT  a sphere. Its light leaves it. What is measured of it (the body) is drawn on its skin, never inside it.
       THE PRISM   the closed form. Only the light goes through it.
       THE POOL    the graphmap. The water is zero: delivered stands above it, frustrated hangs below it.
     What is on the map: a line (one pin: corner = station, distance from centre = Dia, height = the claim, brightness =
     Lumens, softness = how far its reads disagree) · a forecast (a second dot where the body stood) · the room (a level) ·
     the body (rings on the mast: height only, no station) · a ledger entry (a ring on the water) · a boundary (a film
     between a line and the earlier line it turns on).
     Reads data/parallelograms/<id>.json (?p=<id>, default tucker_record) and data/active/object.json. Nothing is computed
     here but pixels. three.js 0.187 is in src/vendor; the older pages stay on r128. -->
<style>
  :root { --field:#0a1226; --deep:#060b1a; --ink:#f6f1e6; --dim:#9aa3b8; --ghost:#5d6680; --rule:rgba(233,236,242,.14);
          --LI:#8fb0e0; --RI:#e0948f; --LP:#8cc79f; --RP:#e0b77a; --gold:#e0b77a; --ember:#e89692; --ash:#8a8f9c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:var(--deep); color:var(--ink); font-family:Georgia,'Iowan Old Style','Times New Roman',serif; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .lb { position:absolute; left:0; top:0; white-space:nowrap; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
        transform:translate(-9999px,-9999px); text-shadow:0 0 8px var(--deep), 0 0 2px var(--deep); will-change:transform; }
  .lb b { font-weight:normal; color:var(--ink); letter-spacing:.04em; text-transform:none; font-size:13px; }
  .lb.big { font-size:12px; color:var(--ink); } .lb.big i { display:block; font-style:normal; color:var(--dim); font-size:10.5px; letter-spacing:.12em; margin-top:2px; }
  .lb.st { font-size:10px; } .lb.step { font-size:10.5px; opacity:0; color:var(--ink); transition:opacity .3s; } .lb.step.on { opacity:1; }
  header { position:fixed; left:0; right:0; top:0; padding:calc(14px + env(safe-area-inset-top)) 18px 26px; pointer-events:none; background:linear-gradient(rgba(6,11,26,.78), rgba(6,11,26,.5) 60%, rgba(6,11,26,0)); }
  #head { display:inline-block; max-width:100%; }
  body.glass header { padding-top:70px; }   /* in the M3P the prism rides on its line above */
  .kicker { font-size:10.5px; letter-spacing:.2em; color:var(--gold); text-transform:uppercase; }
  h1 { font-size:clamp(17px,2.2vw,24px); font-weight:normal; margin:3px 0 4px; max-width:34ch; line-height:1.2; }
  .board { display:flex; flex-wrap:wrap; gap:2px 14px; font-size:11.5px; color:var(--dim); } .board b { font-weight:normal; color:var(--ink); font-size:14px; }
  .how { font-size:11.5px; color:var(--ghost); margin-top:5px; max-width:60ch; }
  .row { display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; margin-top:8px; }
  @media (min-width:721px) { .row { position:fixed; right:18px; top:calc(14px + env(safe-area-inset-top)); margin:0; justify-content:flex-end; } body.glass .row { top:70px; } }
  #views { pointer-events:auto; display:inline-flex; border:1px solid var(--rule); border-radius:6px; overflow:hidden; background:rgba(10,18,38,.7); }
  #views button { background:none; border:0; color:var(--dim); font:inherit; font-size:12px; padding:5px 10px; cursor:pointer; } #views button + button { border-left:1px solid var(--rule); } #views button.on { color:var(--gold); }
  header select { pointer-events:auto; background:rgba(10,18,38,.7); color:var(--ink); border:1px solid var(--rule); border-radius:6px; font:inherit; font-size:12px; padding:5px 8px; max-width:min(78vw,360px); }
  footer { position:fixed; left:0; right:0; bottom:0; padding:0 14px calc(12px + env(safe-area-inset-bottom)); pointer-events:none; }
  #body { display:flex; gap:6px; overflow-x:auto; padding:6px 0 8px; pointer-events:auto; scrollbar-width:none; } #body::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:1px solid var(--rule); background:rgba(10,18,38,.62); border-radius:999px; padding:5px 11px 5px 9px; font-size:12px; color:var(--dim); cursor:pointer; white-space:nowrap; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .chip i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:0; box-shadow:0 0 8px currentColor; }
  .chip b { font-weight:normal; color:var(--ink); margin-left:5px; } .chip.on { border-color:currentColor; color:var(--ink); } .chip.none b { color:var(--ghost); }
  #time { display:flex; align-items:center; gap:10px; pointer-events:auto; background:rgba(10,18,38,.62); border:1px solid var(--rule); border-radius:10px; padding:8px 12px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  #play { flex:none; width:34px; height:34px; border-radius:50%; border:1px solid rgba(224,183,122,.6); background:none; color:var(--gold); font-size:13px; cursor:pointer; }
  #when { flex:none; font-size:13px; min-width:86px; } #led { font-size:11.5px; color:var(--dim); flex:1 1 0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  input[type=range] { flex:2 1 120px; min-width:90px; accent-color:#e0b77a; }
  #card { position:fixed; right:14px; top:50%; transform:translateY(-50%); width:min(330px,calc(100vw - 28px)); background:rgba(8,14,30,.86); border:1px solid var(--rule); border-radius:10px; padding:13px 15px 12px; font-size:13px; line-height:1.42;
          backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:none; }
  #card.on { display:block; } #card .x { position:absolute; right:8px; top:4px; background:none; border:0; color:var(--dim); font-size:20px; cursor:pointer; padding:4px 8px; }
  #card .who { font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); padding-right:26px; } #card q { display:block; margin:6px 0 9px; font-size:14.5px; quotes:none; }
  #card .nums { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:8px; } #card .nums div { border-top:1px solid var(--rule); padding-top:5px; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  #card .nums b { display:block; font-weight:normal; font-size:17px; color:var(--ink); letter-spacing:0; text-transform:none; }
  #card .why { color:var(--dim); font-size:12px; } #card .fc { margin-top:7px; font-size:12px; } #card .fc.right { color:var(--gold); } #card .fc.wrong { color:var(--ember); } #card .fc.open { color:var(--ash); }
  #card a { color:var(--dim); font-size:11.5px; }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:30px; color:var(--dim); font-size:14px; } #err.on { display:flex; }
  .lb.st .n { display:none; }
  @media (max-width:720px) { .how { font-size:10.5px; } .lb { font-size:9.5px; letter-spacing:.1em; } .lb b { font-size:11.5px; } .lb.big i { font-size:9px; } .lb.st .w { display:none; } .lb.st .n { display:inline; font-size:11px; } #card { right:14px; left:14px; top:auto; bottom:calc(128px + env(safe-area-inset-bottom)); transform:none; width:auto; } #led { display:none; } h1 { font-size:16px; } }
</style>
<script type="importmap">{ "imports": { "three": "../src/vendor/three-0.187.0/three.module.js", "three/addons/": "../src/vendor/three-0.187.0/addons/" } }</script>

<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<header><div id="head">
  <div class="kicker">Prism · the instrument</div>
  <h1 id="title">&nbsp;</h1>
  <div class="board" id="board"></div>
  <div class="how">Up is delivered, down is frustrated. Farther from the centre is hotter. Brighter holds more of what is measured.</div>
  <div class="row"><select id="sets" aria-label="which set is on the map"></select><span id="views"><button data-v="whole" class="on">the whole</button><button data-v="map">the map</button><button data-v="under">from below</button></span></div>
</div></header>
<div id="card"><button class="x" id="cx" aria-label="close">×</button><div id="cardIn"></div></div>
<footer>
  <div id="body"></div>
  <div id="time"><button id="play" aria-label="replay">▶</button><span id="when"></span><input id="scrub" type="range" min="0" max="1" value="1" step="1" aria-label="date"><span id="led"></span></div>
</footer>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const SET = Q.get('p') || 'tucker_record';
if (window.parent !== window) document.body.classList.add('glass');

// ── the numbers of the scene ──────────────────────────────────────────────────────────────────────────────────────────
const MAP = 2.8, HALF = MAP / 2;           // the graphmap, as everywhere else
const ZH = 0.75 * 2.2 * 0.8;               // world height of z = 1 (the cloud's own number: 1.32)
const OBJ = new THREE.Vector3(-4.35, 2.95, 0), R = 0.86;       // the Object
const PRISM = new THREE.Vector3(-1.95, 2.9, 0), TILT = -0.5;  // the prism, leaning over the pool
const ST = { LI: 0x8fb0e0, RI: 0xe0948f, LP: 0x8cc79f, RP: 0xe0b77a };       // the stations as light
const CREAM = 0xf6f1e6;
const BODYCOL = { war: 0xe8e2d6, barrel: 0xc9a06a, pump: 0xd4a94e, dollar: 0x7fa3c0, vote: 0xb9a7d8, law: 0x9fc7a8, prices: 0xd98f6a, jobs: 0xa9a9d6, mood: 0xd6c98a, lives: 0xb0523a, direction: 0xc7b8e6 };
const PINCOL = { right: 0xe0b77a, wrong: 0xd9604a, open: 0x8a8f9c };
const raw = h => new THREE.Color().setHex(h, THREE.LinearSRGBColorSpace);   // for our own shaders: the value as written
const hex = h => '#' + h.toString(16).padStart(6, '0');
const day = s => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5);
const iso = d => new Date(d * 864e5).toISOString().slice(0, 10);
const zs = z => z == null ? '—' : (z > 0 ? '+' : z < 0 ? '−' : '') + Math.abs(z).toFixed(2);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);

// ── the renderer ──────────────────────────────────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07; controls.enablePan = false;
controls.minDistance = 4; controls.maxDistance = 40; controls.maxPolarAngle = Math.PI * 0.66;   // you can go under the water
const FILM_GLSL = `
  vec3 film(float t){ return 0.5 + 0.5 * cos(6.2831853 * t * 1.3 / vec3(0.65, 0.532, 0.473)); }
  const vec3 CREAM = vec3(0.965, 0.945, 0.905);
  float hash(vec3 p){ p = fract(p * 0.3183099 + .1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float noise(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
    return mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x), mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
               mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x), mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z); }`;
const uT = { value: 0 };

// the night field and its stars
{
  const dome = new THREE.Mesh(new THREE.SphereGeometry(90, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false,
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 a = vec3(0.024,0.043,0.102), b = vec3(0.039,0.071,0.149), c = vec3(0.016,0.027,0.066); gl_FragColor = vec4(h > 0.0 ? mix(b, a, smoothstep(0.0, 0.7, h)) : mix(b, c, smoothstep(0.0, 0.5, -h)), 1.0); }' }));
  dome.renderOrder = -10; scene.add(dome);
  const n = 900, p = new Float32Array(n * 3), c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const u = Math.random() * 2 - 1, a = Math.random() * 6.2832, s = Math.sqrt(1 - u * u), r = 70;
    p.set([r * s * Math.cos(a), r * u, r * s * Math.sin(a)], i * 3); const b = 0.25 + Math.pow(Math.random(), 3) * 0.75; c.set([b * 0.96, b * 0.94, b * 0.9], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, vertexColors: true, depthWrite: false })));
}
// what the glass reflects: the night, and a few soft lights in the film's colours
{
  const env = new THREE.Scene(); env.background = new THREE.Color(0x070d1e);
  const card = (c, x, y, z, s, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };
  card(0xf6f1e6, -8, 1, 0, 5, 3.0); card(0xbee8ff, 4, 7, 5, 5, 1.6); card(0xffd4ec, 5, -2, -7, 5, 1.2); card(0xd6ffe2, -3, 6, -7, 4, 1.2); card(0xffe8ce, 0, -8, 3, 6, 1.0); card(0xecdbff, 7, 3, -1, 4, 1.4);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(env, 0.04).texture; pm.dispose();
}

// ── THE OBJECT ────────────────────────────────────────────────────────────────────────────────────────────────────────
// A perfect sphere. Its skin is a thin film that never holds still, so the surface is seen and not known. It gives its own light.
const object = new THREE.Group(); object.position.copy(OBJ); scene.add(object);
const skin = new THREE.Mesh(new THREE.SphereGeometry(R, 96, 64), new THREE.ShaderMaterial({ uniforms: { uT },
  vertexShader: 'varying vec3 vN, vW, vO; void main(){ vO = position; vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: `varying vec3 vN, vW, vO; uniform float uT; ${FILM_GLSL}
    void main(){ vec3 N = normalize(vN), V = normalize(cameraPosition - vW); float ndv = clamp(dot(N, V), 0.0, 1.0), fr = pow(1.0 - ndv, 2.0);
      float th = 0.30 + 0.55 * noise(vO * 1.5 + vec3(0.0, uT * 0.035, uT * 0.02)) + 0.16 * noise(vO * 4.0 - uT * 0.05);
      vec3 f = mix(film(th + (1.0 - ndv) * 0.42), CREAM, 0.38);                         // the film, milky
      vec3 col = mix(vec3(0.030, 0.046, 0.105), vec3(0.105, 0.135, 0.235), pow(ndv, 0.8)); // the dark pearl
      col += f * (0.10 + 0.50 * fr);                                                    // strongest where the surface turns away
      col += CREAM * (0.07 * ndv + 0.22 * pow(fr, 2.5));                                // its own light
      gl_FragColor = vec4(col, 1.0); }` }));
object.add(skin);
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,.42)'); g.addColorStop(0.6, 'rgba(255,255,255,.08)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const glow = (color, size, opacity) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false })); s.scale.setScalar(size); return s; };
const aura = glow(0xe6ebff, R * 6.4, 0.55); aura.position.copy(OBJ); aura.renderOrder = -5; scene.add(aura);
// a slim pedestal, standing off under it
{ const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { uTop: { value: OBJ.y - R - 0.2 } },
    vertexShader: 'varying vec3 vW; varying vec3 vN; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: 'varying vec3 vW; varying vec3 vN; uniform float uTop; void main(){ float d = uTop - vW.y; float l = 0.45 + 0.55 * max(dot(normalize(vN), normalize(vec3(0.5, 0.6, 0.6))), 0.0); vec3 c = vec3(0.30, 0.34, 0.46) * l + vec3(0.25, 0.27, 0.34) * exp(-d * 3.0); gl_FragColor = vec4(c, smoothstep(2.3, 0.2, d) * 0.95); }' });
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 2.4, 40, 1, true), m); col.position.set(OBJ.x, OBJ.y - R - 0.26 - 1.2, 0); scene.add(col);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.18, 0.07, 40), m); cap.position.set(OBJ.x, OBJ.y - R - 0.23, 0); scene.add(cap);
  scene.add(new THREE.AmbientLight(0x8090c0, 0.6)); const l = new THREE.DirectionalLight(0xdfe6ff, 0.8); l.position.set(-2, 6, 5); scene.add(l); }
const skinLines = new THREE.Group(); object.add(skinLines);      // the body, drawn on the skin (built once the data is in)

// ── THE PRISM ─────────────────────────────────────────────────────────────────────────────────────────────────────────
const PS = 1.5, PD = 1.15;   // the navtool's triangle, larger, with depth
const prism = new THREE.Group(); prism.position.copy(PRISM); prism.rotation.z = TILT; scene.add(prism);
{ const s = new THREE.Shape(); s.moveTo(-0.5 * PS, -0.42 * PS); s.lineTo(0.5 * PS, -0.42 * PS); s.lineTo(0, 0.5 * PS); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: PD, bevelEnabled: true, bevelThickness: 0.018, bevelSize: 0.018, bevelSegments: 3 }); g.center();
  const glass = new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.03, metalness: 0, transmission: 1, thickness: 0.9, ior: 1.5, dispersion: 6,
    iridescence: 1, iridescenceIOR: 1.33, iridescenceThicknessMinimum: 180, iridescenceThicknessMaximum: 520, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.0, attenuationColor: new THREE.Color(0xdfe8ff), attenuationDistance: 6 }));
  glass.renderOrder = 2; prism.add(glass);
  // the film the navtool's prism has always worn (cos 2π·λ/[650,532,473]), over the glass
  const shell = new THREE.Mesh(g, new THREE.ShaderMaterial({ uniforms: { uT }, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'varying vec3 vN; varying vec3 vV; uniform float uT; void main(){ float f = 1.0 - abs(dot(normalize(vN), normalize(vV))); float t = f * 1.1 + uT * 0.02; vec3 c = 0.5 + 0.5 * cos(6.2831853 * t * 1.3 / vec3(0.65, 0.532, 0.473)); vec3 col = mix(vec3(0.75, 0.82, 1.0), c, 0.5); gl_FragColor = vec4(col, 0.10 + 0.50 * f); }' }));
  shell.renderOrder = 2.5; prism.add(shell);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(g, 30), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 })); e.renderOrder = 3; prism.add(e); }
const pTop = 0.46 * PS, pBot = -0.46 * PS;                       // the centred triangle's y range
const faceR = y => new THREE.Vector3(0.5 * PS - (y - pBot) * (0.5 * PS / (pTop - pBot)), y, 0);
const faceL = y => { const v = faceR(y); v.x = -v.x; return v; };
const toWorld = v => v.clone().applyAxisAngle(new THREE.Vector3(0, 0, 1), TILT).add(PRISM);
const ENTRY = toWorld(faceL(0.02 * PS));
const exitTop = 0.24 * PS, exitBot = -0.20 * PS, exitDepth = 0.5;
// where a ray leaves the glass for a place on the map: a across (x), b in depth (z), both 0…1
const exitAt = (a, b) => { const p = toWorld(faceR(lerp(exitBot, exitTop, a))); p.z += (b - 0.5) * exitDepth; return p; };
const footAt = (a, b) => new THREE.Vector3((a - 0.5) * MAP, 0, (b - 0.5) * MAP);
const SRC = OBJ.clone().add(ENTRY.clone().sub(OBJ).normalize().multiplyScalar(R * 0.985));   // where the light leaves the Object

// a shaft of light between two points: a ribbon that always turns to face you
function shaft(a, b, w0, w1, frag, order, depthTest = true) {

    p.fcDay = f.cameDue && f.due && /^\d{4}-/.test(f.due) ? day(f.due) : NOW; }
  const hit = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), new THREE.MeshBasicMaterial({ visible: false })); hit.userData.pin = p; g.add(hit); hits.push(hit);

// a boundary: where the second pass found a speaker turning on his own earlier line. A film stands between the two, and the track crosses it.
Object.entries(MOM).forEach(([i, m]) => { const a = pins.find(p => p.l.i === +m.turnsOn), b = pins.find(p => p.l.i === +i); if (!a || !b) return;

// a ledger entry lands as a ring on the water
const ripples = [];
function ripple() { const m = new THREE.Mesh(new THREE.RingGeometry(0.96, 1.0, 72), new THREE.MeshBasicMaterial({ color: CREAM, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));

// ── a parallelogram on its way: out of the Object, through the glass, to its place ────────────────────────────────────────
const noteGeo = (() => { const g = new THREE.PlaneGeometry(0.25, 0.145); g.applyMatrix4(new THREE.Matrix4().makeShear(0, 0, 0.45, 0, 0, 0)); return g; })();
const notes = pins.map(p => { const m = new THREE.Mesh(noteGeo, new THREE.ShaderMaterial({ uniforms: { uT, uMix: { value: 0 }, uC: { value: raw(ST[p.l.station] || CREAM) }, uAlpha: { value: 0 } }, transparent: true, depthWrite: false, depthTest: false, side: THREE.DoubleSide,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `varying vec2 vUv; uniform float uT, uMix, uAlpha; uniform vec3 uC; ${FILM_GLSL} void main(){ vec3 c = mix(CREAM, film(vUv.x * 0.8 + vUv.y * 0.5 + uT * 0.2), 0.45); c = mix(c, uC, uMix);

// ── time ──────────────────────────────────────────────────────────────────────────────────────────────────────────────
const scrub = $('scrub'); scrub.min = Math.min(FIRST, T0 + 1); scrub.max = NOW; scrub.value = NOW;
const ledger = (B.topic && B.topic.ledger) || [];
let lastLedger = -1;
function setWhen(d, quiet) { when = d; scrub.value = d; $('when').textContent = iso(d);

    chips.push(`<button class="chip${called === m.id ? ' on' : ''}${r ? '' : ' none'}" data-m="${m.id}" style="color:${hex(col)}"><i style="background:${hex(col)}"></i><span style="color:inherit">${m.label}</span><b>${r ? zs(r[1]) : 'no z'}</b></button>`); });

  if (li !== lastLedger && li >= 0 && !quiet) ripple(); lastLedger = li;
  // the Object turns so that this day faces the glass
  object.userData.to = -lonOf(d);
  if (!playing) pins.forEach(p => show(p, p.d <= d ? 1 : 0));
  pins.forEach(p => { if (p.fc) p.fc.visible = p.fcDay <= d && p.shown > 0.5; if (p.boundary) p.boundary.visible = p.d <= d && p.shown > 0.5; });
  callUp(called, true);
}
function show(p, a) { p.shown = a; p.g.visible = a > 0.01; p.g.scale.setScalar(0.4 + 0.6 * a); if (p.halo) p.halo.material.opacity = p.haloA * a; }
function callUp(id, keep) { if (!keep) called = called === id ? null : id;
  Object.entries(rings).forEach(([k, r]) => { const on = k === called; r.wide.material.opacity = on ? 0.75 : 0; r.band.material.opacity = on ? 0.07 : 0; r.small.material.opacity = called && !on ? 0.3 : 0.85;
    const s = skinOf[k]; if (s) { s.line.material.opacity = on ? 1 : called ? 0.18 : 0.5; s.line.material.linewidth = on ? 2.6 : 1.3; } });
  pins.forEach(p => { const dim = called && p.l.measure !== called; p.parts.forEach(m => { if (m.material && m.material.transparent) m.material.opacity = (m.userData.o ?? (m.userData.o = m.material.opacity)) * (dim ? 0.35 : 1); }); if (p.halo) p.halo.material.opacity = p.haloA * p.shown * (dim ? 0.2 : 1); });
  const r = called && rings[called], rd = r && asOf(r.m.readings, when); bodyLbl.show = !!rd;
  if (rd) { bodyLbl.pos.set(0, rd[1] * ZH, HALF * 1.04); bodyLbl.el.innerHTML = `<span style="color:${hex(BODYCOL[called] || 0xd4a94e)}">${r.m.label} <b>${zs(rd[1])}</b></span> · ${rd[0]}`; }
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.m === called)); }
$('body').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) callUp(c.dataset.m); });
scrub.addEventListener('input', () => { stop(); setWhen(+scrub.value); });

// the replay: the set passed through again, in the order it was said
let playing = false, tPlay = 0; const GAP = clamp(9 / Math.max(1, pins.length), 0.07, 0.4), DUR = 2.6;
function play() { playing = true; tPlay = 0; focus(null); pins.forEach(p => show(p, 0)); $('play').textContent = '■'; setWhen(pins.length ? pins[0].d : NOW, true); }
function stop() { if (!playing) return; playing = false; notes.forEach(n => n.visible = false); stepLbl.el.classList.remove('on'); $('play').textContent = '▶'; }
$('play').onclick = () => { if (playing) { stop(); setWhen(NOW); } else play(); };
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
const WRITE = ENTRY.clone().lerp(SRC, 0.3).add(new THREE.Vector3(0, 0.55, 0.5));   // where a written note is set into the beam, just before the glass
function stepPlay(dt) { tPlay += dt; let latest = -1, inGlass = -1;
  pins.forEach((p, k) => { const n = notes[k], t = (tPlay - k * GAP) / DUR; if (t <= 0) { n.visible = false; return; } latest = k;
    if (t >= 1) { n.visible = false; if (p.shown < 1) show(p, Math.min(1, p.shown + dt * 4)); return; }
    n.visible = true; const ex = exitAt(clamp(p.a, 0, 1), clamp(p.b, 0, 1));

    else if (t < 0.56) { n.position.lerpVectors(ENTRY, ex, (t - 0.36) / 0.2); inGlass = Math.max(inGlass, (t - 0.36) / 0.2); }

  stepLbl.el.classList.toggle('on', inGlass >= 0); if (inGlass >= 0) stepLbl.el.textContent = STEPS[Math.floor(inGlass * 3.999)];
  if (latest >= 0 && pins[latest].d !== when) setWhen(pins[latest].d);

  if (tPlay > (pins.length - 1) * GAP + DUR + 0.6) { stop(); setWhen(NOW); } }

// ── a line, taken up ──────────────────────────────────────────────────────────────────────────────────────────────────
const mark = new THREE.Group(); mark.visible = false; scene.add(mark);
function focus(p) { mark.clear(); mark.visible = !!p; $('card').classList.toggle('on', !!p); if (!p) return; const l = p.l, f = l.forecast;
  mark.add(fat(circle(0.085, 0, 40).map((v, i) => i % 3 === 0 ? v + p.pos.x : i % 3 === 1 ? v + p.pos.y : v + p.pos.z), CREAM, 1.4, 0.9));
  // the three distances, drawn: to the body as it stood on the line's date, and to the room that day
  const tick = (z, col, dashed) => { const y = z * ZH; mark.add(fat([p.pos.x, p.pos.y, p.pos.z, p.pos.x, y, p.pos.z], col, 1.2, 0.8, dashed)); mark.add(fat(circle(0.07, 0, 32).map((v, i) => i % 3 === 0 ? v + p.pos.x : i % 3 === 1 ? v + y : v + p.pos.z), col, 1.6, 0.95)); };
  if (l.bodyReading && l.z != null) tick(l.bodyReading.z, BODYCOL[l.measure] || CREAM, false);
  if (l.roomReading && l.z != null) tick(l.roomReading.z, CREAM, true);
  const w = f ? (f.result || 'open').replace(' so far', '') : '', m = bodyOf(l.measure);
  $('cardIn').innerHTML = `<div class="who" style="color:${hex(ST[l.station] || CREAM)}">${l.who} · ${l.date} · ${l.station}</div><q>“${l.quote}”</q>
    <div class="nums"><div>the claim<b>${l.z == null ? 'unmeasured' : zs(l.z)}</b></div><div>heat (Dia)<b>${l.dia}</b></div><div>Lumens<b>${typeof l.lumens === 'number' ? Math.round(l.lumens * 100) : '—'}</b></div></div>
    <div class="why">${l.z == null ? 'A line about who is to blame. Nothing measured sees it, so it lies on the water unlit.' : 'About ' + (m ? m.label : l.measure) + (l.bodyReading ? (l.bodyReading.nearest ? '. The nearest reading of the body is <b style="color:var(--ink);font-weight:normal">' : '. The body stood at <b style="color:var(--ink);font-weight:normal">') + zs(l.bodyReading.z) + '</b> on ' + l.bodyReading.date : '. No reading of the body on that date') + (l.room != null ? '; ' + zs(l.room) + ' from the room that day' : '') + '.'}
      ${l.runs && std(l.runs) > 0 ? '<br>Its reads put the heat at ' + l.runs.join(', ') + '.' : ''}${p.mom ? '<br>The second pass: ' + p.mom.why : ''}</div>
    ${f ? `<div class="fc ${w}">forecast · due ${f.due}${f.dueFrom ? ' (' + f.dueFrom + ')' : ''} · <b>${f.result || 'open'}</b>${f.gap != null ? ' · gap ' + zs(f.gap) : ''}${f.onLedger ? '<br>' + f.onLedger : ''}</div>` : ''}
    ${l.url ? `<div style="margin-top:7px"><a href="${l.url}" target="_blank" rel="noopener">the post →</a></div>` : ''}`; }
$('cx').onclick = () => focus(null);
{ const ray = new THREE.Raycaster(), v = new THREE.Vector2(); let down = null;
  renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', e => { if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
    v.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(v, camera);
    const h = ray.intersectObjects(hits.filter(m => m.userData.pin.shown > 0.5), false)[0]; focus(h ? h.object.userData.pin : null); }); }

// ── the camera: the whole scene, whatever the screen ──────────────────────────────────────────────────────────────────
const BOX = [OBJ.x - R - 0.15, -ZH - 0.2, POOL.z0, POOL.x1 + 0.15, OBJ.y + R + 0.6, POOL.z1];
const MAPBOX = [-HALF - 0.25, -ZH - 0.1, -HALF - 0.25, HALF + 0.25, ZH * 0.7, HALF + 0.25];
let VIEW = 'whole', tween = null;
function fit(tgt, dir, box, mx, myT, myB) { let lo = 2, hi = 60; const keepP = camera.position.clone(), keepQ = camera.quaternion.clone();

    for (let k = 0; k < 8; k++) { tmpA.set(box[k & 1 ? 3 : 0], box[k & 2 ? 4 : 1], box[k & 4 ? 5 : 2]).project(camera); if (Math.abs(tmpA.x) > mx || tmpA.y > myT || tmpA.y < -myB) { ok = false; break; } }
    if (ok) hi = d; else lo = d; }

function pose(name) { const tall = camera.aspect < 0.85, glass = document.body.classList.contains('glass'), top = (glass ? 0.2 : 0.1) * 2 * (tall ? 2.1 : 1);

    let cx = 0, cz = 0; pins.forEach(p => { cx += p.pos.x; cz += p.pos.z; }); const th = Math.hypot(cx, cz) > 0.05 * pins.length ? Math.atan2(cz, cx) : Math.PI / 4;

    const A = [1.22, 1.57, 1.92, -1.22, -1.92].map(a => [a, Math.abs(Math.sin(a - th)) + (a > 0 ? 0.25 : 0)]).sort((u, v) => v[1] - u[1])[0][0], cand = [Math.cos(A), Math.sin(A)];

  return fit(new THREE.Vector3(tall ? -0.9 : -1.25, tall ? 1.0 : 1.05, 0), (tall ? new THREE.Vector3(0.86, 0.46, 0.50) : new THREE.Vector3(0.30, 0.47, 0.90)).normalize(), BOX, 0.95, 1 - top, tall ? 0.7 : 0.74); }
let headRect = { bottom: 0, right: 0 }, footH = 0;
function frameAll() { const w = innerWidth, h = innerHeight; headRect = $('head').getBoundingClientRect(); footH = document.querySelector('footer').getBoundingClientRect().height + 4; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const p = pose(VIEW); tween = null; camera.position.copy(p.pos); controls.target.copy(p.tgt); controls.update(); }
function view(name) { VIEW = name; const p = pose(name); tween = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1: p.pos, t1: p.tgt };
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === name)); }
$('views').addEventListener('click', e => { const b = e.target.closest('button'); if (b) view(b.dataset.v); });
renderer.domElement.addEventListener('pointerdown', () => { tween = null; });
addEventListener('resize', frameAll); frameAll();

// in the M3P: a program in the glass
if (window.parent !== window) { const tell = m => { try { window.parent.postMessage(m, '*'); } catch (e) {} };
  tell({ type: 'g4:crumb', name: 'Prism', fn: '', crumb: 'Prism · the model' }); tell({ type: 'g4:navpos', t: 0.5 });
  addEventListener('message', e => { const m = e.data || {}; if (m.type === 'g4:nav' && (m.dir === 'up' || m.dir === 'back')) tell({ type: 'g4:desk' }); }); }

// ── every frame ───────────────────────────────────────────────────────────────────────────────────────────────────────
setWhen(NOW, true); object.rotation.y = object.userData.to;
if (!Q.has('still')) setTimeout(play, 700);
const clock = new THREE.Timer(); let lite = false, qN = 0, qT = 0;
function setLite() { lite = true; renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.25)); prism.children[0].visible = false; frameAll(); }
if (Q.has('lite')) setLite(); const hw = () => innerWidth / 2, hh = () => innerHeight / 2;

  for (let i = ripples.length - 1; i >= 0; i--) { const m = ripples[i]; m.userData.t += dt; const t = m.userData.t / 2.4; m.scale.setScalar(0.1 + t * HALF * 1.5); m.material.opacity = 0.7 * (1 - t); if (t >= 1) { scene.remove(m); ripples.splice(i, 1); } }
  fan.material.uniforms.uAlpha.value += ((VIEW === 'whole' ? 1 : 0.5) - fan.material.uniforms.uAlpha.value) * Math.min(1, dt * 3);
  if (tween) { tween.t = Math.min(1, tween.t + dt / 1.2); const k = ease(tween.t); camera.position.lerpVectors(tween.p0, tween.p1, k); controls.target.lerpVectors(tween.t0, tween.t1, k); if (tween.t >= 1) tween = null; }
  controls.update(); renderer.render(scene, camera);
  const hr = headRect; for (const o of LBL) { if (!o.show) { o.el.style.transform = 'translate(-9999px,-9999px)'; continue; } tmpB.copy(o.pos).project(camera);
    const lx = tmpB.x * hw() + hw(), ly = -tmpB.y * hh() + hh();
    if (tmpB.z > 1 || (ly < hr.bottom + 6 && lx < hr.right + 40) || ly < 4 || ly > innerHeight - footH) { o.el.style.transform = 'translate(-9999px,-9999px)'; continue; }
    o.el.style.transform = `translate(${(tmpB.x * hw() + hw()).toFixed(1)}px,${(-tmpB.y * hh() + hh()).toFixed(1)}px) translate(${-o.ax * 100}%,${-o.ay * 100}%)`; }
  window.__frames = (window.__frames || 0) + 1;
  if (!lite && ++qN > 20 && qN <= 80) { qT += clock.getDelta(); if (qN === 80 && qT / 60 > 0.03) setLite(); } });
window.__model = { setWhen, play, stop, callUp, focus, view, pins, frameAll, camera, controls, NOW, adv: n => { for (let i = 0; i < n; i++) { if (playing) stepPlay(0.05); if (tween) { tween.t = 1; } } } };
</script>
