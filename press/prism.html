<!doctype html>
<html lang="en">
<head>

<title>Prism</title>
<!-- Prism, the program (11-14). What Prism has processed, shown as it stands. Nothing is asked of whoever is looking.
     It opens as the graphmap with every line on file pinned to it: the state of the map, as a whole.
       THE OBJECT   up at the far edge. Its light leaves it.
       THE PRISM    the closed form. The light goes through it and lands on the map as the four stations.
       THE MAP      a plane under the camera (no pool here; the pool is the villa's). Up is delivered, down is frustrated.
     One pin per line: corner = station, distance from centre = Dia, height = the claim (z), brightness = Lumens. A line about
     who is to blame carries no z and lies flat on the map as a ring.
     Tap a pin for the line and its scores. The toggles are inside the prism: rest the pointer on it, or tap it.
       time   everything on file by default; a window narrows it; the date slides the window's end
       type   lines about the object / about who is to blame · the records / the room day by day · one measure called up
     Reads data/parallelograms/index.json, every set it lists, and data/active/object.json. Nothing is computed here but pixels.
     The scene is press/model.html's (three.js 0.187, src/vendor), with the water taken out. model.html still shows one set at a time.
     The landing this replaces is kept beside it: press/prism_landing_2026-11-10.html. -->
<style>
  :root { --field:#0a1226; --deep:#060b1a; --ink:#f6f1e6; --dim:#9aa3b8; --ghost:#5d6680; --rule:rgba(233,236,242,.14);
          --LI:#8fb0e0; --RI:#e0948f; --LP:#8cc79f; --RP:#e0b77a; --gold:#e0b77a; --ember:#e89692; --ash:#8a8f9c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:var(--field); color:var(--ink); font-family:Georgia,'Iowan Old Style','Times New Roman',serif; }
  canvas#c { position:fixed; left:0; top:0; display:block; touch-action:none; }
  #labels { position:fixed; left:0; top:0; pointer-events:none; overflow:hidden; }
  /* the reading: one column, always in the same place, always in the same order */
  #reading { position:fixed; right:0; bottom:0; overflow-y:auto; z-index:3; text-shadow:0 0 10px var(--field), 0 0 3px var(--field); }   /* no panel: the reading is set on the glass itself, the stars behind it */
  #readIn { padding:18px 22px 26px; max-width:520px; font-size:13.5px; line-height:1.5; } body.glass.wide #readIn { padding-top:76px; }
  #readIn .nav { display:flex; align-items:center; gap:8px; margin-bottom:16px; font-size:11.5px; color:var(--dim); } #readIn .nav span { min-width:92px; text-align:center; }
  #readIn .nav button { background:none; border:1px solid var(--rule); border-radius:3px; color:var(--dim); font:inherit; padding:3px 9px; cursor:pointer; } #readIn .nav button:hover { color:var(--ink); border-color:rgba(224,183,122,.6); } #readIn .nav .whole { margin-left:auto; }
  #readIn .who { font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); }
  #readIn q { display:block; quotes:none; font-size:clamp(19px,2vw,25px); line-height:1.28; margin:8px 0 18px; } #readIn q.plain { color:var(--ink); }
  .three { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; } .three label { display:block; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
  .three b { display:block; font-weight:normal; font-size:30px; line-height:1.15; } .three span { font-size:11.5px; color:var(--dim); }
  .sc { position:relative; height:7px; margin-top:9px; } .sc u { position:absolute; top:-4px; width:2px; height:15px; margin-left:-1px; background:var(--ink); } .sc u.o { background:var(--LI); }
  .sc.dia { display:grid; grid-template-columns:33fr 33fr 34fr; gap:2px; } .sc.dia i { background:rgba(233,236,242,.16); } .sc.dia i:nth-child(2) { background:rgba(233,236,242,.28); } .sc.dia i:nth-child(3) { background:rgba(233,236,242,.42); }
  .sc.z { background:rgba(233,236,242,.16); } .sc.z em, .track.z em { position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:var(--ghost); }
  .sc.lum { background:rgba(233,236,242,.1); } .sc.lum em { display:block; height:100%; background:var(--ink); box-shadow:0 0 10px rgba(246,241,230,.7); }
  .cap { display:flex; justify-content:space-between; font-size:10px; color:var(--ghost); margin-top:5px; } .cap span { font-size:10px; color:var(--ghost); }
  .key { font-size:11px; color:var(--ghost); margin-top:10px; } .key u { display:inline-block; width:2px; height:11px; background:var(--ink); vertical-align:-1px; margin:0 5px 0 0; } .key u.o { background:var(--LI); margin-left:12px; }
  #readIn h5 { font-weight:normal; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin:18px 0 4px; padding-top:12px; border-top:1px solid var(--rule); }
  #readIn p { color:var(--ink); } #readIn p b { font-weight:normal; color:var(--gold); } #readIn p.hint, #readIn .note, #readIn p.src { color:var(--dim); font-size:12px; margin-top:8px; } #readIn a { color:var(--dim); }
  #readIn .fc.right b { color:var(--gold); } #readIn .fc.wrong b { color:var(--ember); } #readIn .fc.open b { color:var(--ash); }
  #readIn details { margin-top:18px; border-top:1px solid var(--rule); padding-top:10px; } #readIn summary { cursor:pointer; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
  .rr { display:grid; grid-template-columns:42px 1fr; align-items:center; gap:8px; margin-top:8px; } .rr label { font-size:11px; color:var(--dim); }
  .track { position:relative; height:26px; border-bottom:1px solid var(--rule); } .track u { position:absolute; width:9px; height:9px; margin-left:-4.5px; border-radius:50%; box-sizing:border-box; }
  .legend { display:grid; gap:2px; margin-top:8px; font-size:12px; color:var(--dim); } .legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; box-sizing:border-box; }
  .ted { display:flex; gap:11px; align-items:flex-start; } .ted img { width:44px; height:44px; object-fit:contain; flex:none; }
  .lb { position:absolute; left:0; top:0; white-space:nowrap; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
        transform:translate(-9999px,-9999px); text-shadow:0 0 8px var(--deep), 0 0 2px var(--deep); will-change:transform; }
  .lb b { font-weight:normal; color:var(--ink); letter-spacing:.04em; text-transform:none; font-size:13px; }
  .lb.big { font-size:12px; color:var(--ink); } .lb.big i { display:block; font-style:normal; color:var(--dim); font-size:10.5px; letter-spacing:.12em; margin-top:2px; }
  .lb.st { font-size:10px; } .lb.st .n { display:none; }
  /* the one line of words on the page: what is on the map right now */
  #state { position:fixed; left:16px; bottom:calc(14px + env(safe-area-inset-bottom)); right:16px; font-size:12px; color:var(--dim); pointer-events:none; text-shadow:0 0 8px var(--deep); }
  #ted { position:fixed; left:14px; bottom:calc(44px + env(safe-area-inset-bottom)); width:min(380px,calc(100vw - 28px)); display:none; gap:11px; align-items:flex-start; background:rgba(8,14,30,.86); border:1px solid var(--rule); border-radius:4px; padding:11px 30px 11px 11px; font-size:13px; line-height:1.45; z-index:4;
         backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  #ted.on { display:flex; } #ted img { width:46px; height:46px; object-fit:contain; flex:none; } #ted b { font-weight:normal; display:block; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin-bottom:3px; }
  #ted .x { position:absolute; right:6px; top:2px; background:none; border:0; color:var(--dim); font-size:19px; cursor:pointer; padding:4px 8px; }
  #card table { width:100%; border-collapse:collapse; margin:2px 0 6px; font-size:12px; } #card td, #card th { text-align:left; padding:4px 6px 4px 0; border-top:1px solid var(--rule); font-weight:normal; } #card th { color:var(--dim); font-size:10px; letter-spacing:.1em; text-transform:uppercase; border-top:0; }
  #card td i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .seg button i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  #state b { font-weight:normal; color:var(--ink); font-size:14px; } #state span + span::before { content:' · '; color:var(--ghost); }
  /* the menu: it lives inside the prism */
  #menu { position:fixed; z-index:6; left:16px; top:120px; width:min(330px,calc(100vw - 20px)); max-height:calc(100% - 140px); overflow-y:auto; padding:13px 14px 11px;
          background:rgba(8,14,30,.9); border:1px solid var(--rule); border-radius:4px; font-size:12.5px; line-height:1.4; opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .18s, transform .18s;
          backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  #menu::before { content:''; position:absolute; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg,#bee8ff,#d6ffe2,#ffe8ce,#ffd4ec,#ecdbff); opacity:.75; }
  #menu.on { opacity:1; transform:none; pointer-events:auto; }
  #menu h4 { font-weight:normal; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin:11px 0 6px; } #menu h4:first-child { margin-top:0; }
  .seg { display:flex; flex-wrap:wrap; gap:5px; }
  .seg button, .chip { border:1px solid var(--rule); background:rgba(10,18,38,.6); border-radius:3px; padding:4px 9px; font:inherit; font-size:12px; color:var(--dim); cursor:pointer; white-space:nowrap; }
  .seg button.on { color:var(--ink); border-color:rgba(224,183,122,.7); }
  .chip i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; box-shadow:0 0 8px currentColor; }
  .chip b { font-weight:normal; color:var(--ink); margin-left:5px; } .chip small { color:var(--ghost); margin-left:5px; font-size:11px; } .chip.on { border-color:currentColor; color:var(--ink); } .chip.none b { color:var(--ghost); }
  #scr { display:flex; align-items:center; gap:10px; margin-top:8px; } #when { flex:none; font-size:12.5px; min-width:84px; color:var(--ink); }
  input[type=range] { flex:1 1 120px; min-width:90px; accent-color:#e0b77a; }
  #led { font-size:11.5px; color:var(--dim); margin-top:5px; min-height:1.4em; }
  #menu .foot { margin-top:12px; padding-top:8px; border-top:1px solid var(--rule); font-size:11.5px; color:var(--ghost); } #menu .foot a { color:var(--dim); }
  #card { position:fixed; right:14px; top:50%; transform:translateY(-50%); width:min(330px,calc(100vw - 28px)); background:rgba(8,14,30,.86); border:1px solid var(--rule); border-radius:4px; padding:13px 15px 12px; font-size:13px; line-height:1.42;
          backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:none; z-index:5; }
  #card.on { display:block; } #card .x { position:absolute; right:8px; top:4px; background:none; border:0; color:var(--dim); font-size:20px; cursor:pointer; padding:4px 8px; }
  #card .who { font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); padding-right:26px; } #card q { display:block; margin:6px 0 9px; font-size:14.5px; quotes:none; }
  #card .nums { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:8px; } #card .nums div { border-top:1px solid var(--rule); padding-top:5px; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  #card .nums b { display:block; font-weight:normal; font-size:17px; color:var(--ink); letter-spacing:0; text-transform:none; }
  #card .why { color:var(--dim); font-size:12px; } #card .fc { margin-top:7px; font-size:12px; } #card .fc.right { color:var(--gold); } #card .fc.wrong { color:var(--ember); } #card .fc.open { color:var(--ash); }
  #card .from { margin-top:8px; padding-top:7px; border-top:1px solid var(--rule); font-size:11.5px; color:var(--ghost); } #card a { color:var(--dim); font-size:11.5px; }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:30px; color:var(--dim); font-size:14px; } #err.on { display:flex; }
  @media (max-width:720px) { .lb { font-size:9.5px; letter-spacing:.1em; } .lb b { font-size:11.5px; } .lb.big i { font-size:9px; } .lb.st .w { display:none; } .lb.st .n { display:inline; font-size:11px; }
    #card { right:14px; left:14px; top:auto; bottom:calc(44px + env(safe-area-inset-bottom)); transform:none; width:auto; } #state { font-size:11px; } }
</style>
<script type="importmap">{ "imports": { "three": "../src/vendor/three-0.187.0/three.module.js", "three/addons/": "../src/vendor/three-0.187.0/addons/" } }</script>

<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="menu">
  <h4>Time</h4>
  <div class="seg" id="win"><button data-w="0" class="on">everything</button><button data-w="365">a year</button><button data-w="90">90 days</button><button data-w="30">30 days</button><button data-w="7">a week</button><button data-w="1">a day</button></div>
  <div id="scr"><span id="when"></span><input id="scrub" type="range" min="0" max="1" value="1" step="1" aria-label="up to this date"></div>
  <div id="led"></div>
  <h4>Type</h4>
  <div class="seg" id="about"><button data-k="object" class="on">about the object</button><button data-k="shadow" class="on">about who is to blame</button></div>
  <div class="seg" id="source" style="margin-top:5px"><button data-k="records" class="on">the records</button><button data-k="room" class="on">the room, day by day</button></div>
  <div id="whoWrap" hidden>
  <h4>Who reads it</h4>
  <div class="seg" id="mode"><button data-k="record" class="on">the record</button><button data-k="readers">the readers, side by side</button></div>
  <div class="seg" id="readers" style="margin-top:5px" hidden></div>
  </div>
  <h4>The Object · one measure called up</h4>
  <div class="seg" id="body"></div>
  <h4>View</h4>
  <div class="seg" id="views"><button data-v="prism" class="on">the map</button><button data-v="side">with the Object</button><button data-v="under">from below</button></div>
  <div class="foot">One set at a time: <a href="model.html" id="toModel">the model</a> · <a href="prism_landing_2026-11-10.html">the earlier landing</a></div>
</div>
<div id="reading"><div id="readIn"></div></div>
<div id="state"></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

const $ = id => document.getElementById(id);
let VW = window.innerWidth, VH = window.innerHeight;   // the map's region of the screen (11-16): the left three fifths on a wide screen, the top on a phone
const READ = $('readIn');
const Q = new URLSearchParams(location.search);
const IN_SHELL = window.parent !== window;
if (IN_SHELL) document.body.classList.add('glass');

// ── the numbers of the scene (model.html's) ───────────────────────────────────────────────────────────────────────────
const MAP = 2.8, HALF = MAP / 2;
const ZH = 0.75 * 2.2 * 0.8;
const OBJ = new THREE.Vector3(-4.7, 3.2, 0), R = 0.86;
const PRISM = new THREE.Vector3(-2.25, 3.15, 0), TILT = -0.5;   // 11-16: stood off from the map, so the map reads on its own
const ST = { LI: 0x8fb0e0, RI: 0xe0948f, LP: 0x8cc79f, RP: 0xe0b77a };
const CREAM = 0xf6f1e6;
const BODYCOL = { war: 0xe8e2d6, barrel: 0xc9a06a, pump: 0xd4a94e, dollar: 0x7fa3c0, vote: 0xb9a7d8, law: 0x9fc7a8, prices: 0xd98f6a, jobs: 0xa9a9d6, mood: 0xd6c98a, lives: 0xb0523a, direction: 0xc7b8e6 };
const raw = h => new THREE.Color().setHex(h, THREE.LinearSRGBColorSpace);
const hex = h => '#' + h.toString(16).padStart(6, '0');
const day = s => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5);
const iso = d => new Date(d * 864e5).toISOString().slice(0, 10);
const zs = z => z == null ? '—' : (z > 0 ? '+' : z < 0 ? '−' : '') + Math.abs(z).toFixed(2);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ── the renderer ──────────────────────────────────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07; controls.enablePan = false;
controls.minDistance = 3; controls.maxDistance = 40; controls.maxPolarAngle = Math.PI * 0.66;
const FILM_GLSL = `
  vec3 film(float t){ return 0.5 + 0.5 * cos(6.2831853 * t * 1.3 / vec3(0.65, 0.532, 0.473)); }
  const vec3 CREAM = vec3(0.965, 0.945, 0.905);
  float hash(vec3 p){ p = fract(p * 0.3183099 + .1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float noise(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
    return mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x), mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
               mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x), mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z); }`;
const uT = { value: 0 };

// the night field and its stars
{
  const dome = new THREE.Mesh(new THREE.SphereGeometry(90, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false,
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 a = vec3(0.035,0.063,0.135), b = vec3(0.039,0.071,0.149), c = vec3(0.033,0.059,0.127); gl_FragColor = vec4(h > 0.0 ? mix(b, a, smoothstep(0.0, 0.7, h)) : mix(b, c, smoothstep(0.0, 0.5, -h)), 1.0); }' }));
  dome.renderOrder = -10; scene.add(dome);
  const n = 900, p = new Float32Array(n * 3), c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const u = Math.random() * 2 - 1, a = Math.random() * 6.2832, s = Math.sqrt(1 - u * u), r = 70;
    p.set([r * s * Math.cos(a), r * u, r * s * Math.sin(a)], i * 3); const b = 0.25 + Math.pow(Math.random(), 3) * 0.75; c.set([b * 0.96, b * 0.94, b * 0.9], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, vertexColors: true, depthWrite: false })));
}
// what the glass reflects
{
  const env = new THREE.Scene(); env.background = new THREE.Color(0x070d1e);
  const card = (c, x, y, z, s, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };
  card(0xf6f1e6, -8, 1, 0, 5, 3.0); card(0xbee8ff, 4, 7, 5, 5, 1.6); card(0xffd4ec, 5, -2, -7, 5, 1.2); card(0xd6ffe2, -3, 6, -7, 4, 1.2); card(0xffe8ce, 0, -8, 3, 6, 1.0); card(0xecdbff, 7, 3, -1, 4, 1.4);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(env, 0.04).texture; pm.dispose();
}

// ── THE OBJECT ────────────────────────────────────────────────────────────────────────────────────────────────────────
const object = new THREE.Group(); object.position.copy(OBJ); scene.add(object);
const skin = new THREE.Mesh(new THREE.SphereGeometry(R, 96, 64), new THREE.ShaderMaterial({ uniforms: { uT },
  vertexShader: 'varying vec3 vN, vW, vO; void main(){ vO = position; vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: `varying vec3 vN, vW, vO; uniform float uT; ${FILM_GLSL}
    void main(){ vec3 N = normalize(vN), V = normalize(cameraPosition - vW); float ndv = clamp(dot(N, V), 0.0, 1.0), fr = pow(1.0 - ndv, 2.0);
      float th = 0.30 + 0.55 * noise(vO * 1.5 + vec3(0.0, uT * 0.035, uT * 0.02)) + 0.16 * noise(vO * 4.0 - uT * 0.05);
      vec3 f = mix(film(th + (1.0 - ndv) * 0.42), CREAM, 0.38);
      vec3 col = mix(vec3(0.030, 0.046, 0.105), vec3(0.105, 0.135, 0.235), pow(ndv, 0.8));
      col += f * (0.10 + 0.50 * fr);
      col += CREAM * (0.07 * ndv + 0.22 * pow(fr, 2.5));

{ const el = renderer.domElement; let d0 = null;   // only a real drag or a zoom takes the camera out of its drift; a tap does not

redraw(); object.rotation.y = object.userData.to;
