<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
#icon{width:1024px;height:1024px;position:relative;background:linear-gradient(160deg,#efe8d8 0%,#e4dbc6 55%,#d3c8ae 100%);overflow:hidden}
#icon::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 15%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%)}
#screen{position:absolute;left:96px;right:96px;top:96px;bottom:200px;border-radius:38px;background:radial-gradient(ellipse at 40% 30%,#16244a 0%,#0a1226 60%,#070d1d 100%);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),inset 0 10px 30px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.7);overflow:hidden}
#screen::after{content:'';position:absolute;inset:0;background:linear-gradient(155deg,rgba(255,255,255,.10),rgba(255,255,255,0) 40%)}
#chin{position:absolute;left:50%;bottom:70px;width:120px;height:14px;transform:translateX(-50%);border-radius:7px;background:linear-gradient(#cfc4aa,#e6dec9);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
#gl{position:absolute;left:0;top:0;width:100%;height:100%}
#solo{width:512px;height:512px;position:relative}
</style></head><body>
<div id="icon"><div id="screen"><canvas id="gl"></canvas></div><div id="chin"></div></div>
<div id="solo"><canvas id="gl2" width="1024" height="1024" style="width:512px;height:512px"></canvas></div>
<script src="three.min.js"></script>
<script src="../src/js/prism-light.js"></script>
<script>
const filmVert='varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }';
const filmFrag='varying vec3 vN; varying vec3 vV; uniform float uT; uniform float uA; void main(){ float f = 1.0 - abs(dot(normalize(vN), normalize(vV))); float t = f * 1.1 + uT; vec3 c = 0.5 + 0.5 * cos(6.2831853 * t * 1.3 / vec3(0.65, 0.532, 0.473)); vec3 base = vec3(0.75, 0.82, 1.0); vec3 col = mix(base, c, 0.6); gl_FragColor = vec4(col, uA * (0.35 + 0.65 * f)); }';
function prismGroup(withRays, W){
  const g=new THREE.Group();
  const film=new THREE.ShaderMaterial({vertexShader:filmVert,fragmentShader:filmFrag,uniforms:{uT:{value:0.18},uA:{value:0.97}},transparent:true,depthWrite:false,side:THREE.DoubleSide});
  const tri=new THREE.Shape(); tri.moveTo(-0.5,-0.42); tri.lineTo(0.5,-0.42); tri.lineTo(0,0.5); tri.closePath();
  const geo=new THREE.ExtrudeGeometry(tri,{depth:0.34,bevelEnabled:false}); geo.center();
  const prism=new THREE.Mesh(geo,film); prism.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.7})));
  prism.rotation.set(-0.32,0.62,0.04); g.add(prism);
  if(withRays){
    // the light (prism-light.js): white beam in, one soft spectrum out
    const light=PrismLight.create(THREE,{beamW:0.2,spread:0.36,drop:0.1});
    light.layout({left:-W,right:W}); light.update(4,0.35); g.add(light.group);
  }
  prism.renderOrder=1; prism.children[0].renderOrder=2;
  return g;
}
function render(canvas,w,h,withRays,scale){
  const r=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,preserveDrawingBuffer:true}); r.setPixelRatio(1); r.setSize(w,h,false); r.setClearColor(0x000000,0);
  const s=new THREE.Scene(), a=w/h, H=1.1/scale, cam=new THREE.OrthographicCamera(-a*H,a*H,H,-H,0.1,50); cam.position.set(0,0,10);
  s.add(prismGroup(withRays,a*H+0.1)); r.render(s,cam);
}
const scr=document.getElementById('screen').getBoundingClientRect();
render(document.getElementById('gl'),Math.round(scr.width),Math.round(scr.height),true,1.3);
render(document.getElementById('gl2'),1024,1024,false,1.6);
window.done=true;
</script></body></html>
