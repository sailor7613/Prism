# PG01 §6 — the active layer (ruled 2026-10-02): EIA flows + prices, GDELT
# detection volume → data/active/. Runs here because EIA and GDELT are
# unreachable from the Cowork shells. The hand-dated files (accruals.json,
# events.json) are never written by this job.
# Secret needed once: EIA_API_KEY (free: https://www.eia.gov/opendata/register.php)
#   → repo Settings → Secrets and variables → Actions → New repository secret.
name: active layer
on:
  schedule:
    - cron: '0 14 * * *'       # 07:00 Pacific (PDT), after the newsroom scan
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: active-layer
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/active-layer.js
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          GDELT_TIMESPAN: 90d
      - name: commit the active layer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/active
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "active layer: $(date -u +%F) — realization + detection + price"
          git pull --rebase
          git push
